name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to main cancels an in-flight PR run, but never an in-flight
# deploy — cancelling `railway up` halfway could leave a half-rolled release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # medusa lint no-ops (and exits non-zero) because eslint isn't installed
      # in this project yet — tsc is the real type-safety gate for now.
      - name: Typecheck
        working-directory: apps/backend
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        working-directory: apps/backend
        run: TEST_TYPE=unit NODE_OPTIONS=--experimental-vm-modules npx jest --silent --runInBand --forceExit

  storefront:
    name: Storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint -w apps/storefront
      - name: Unit tests
        run: npm run test -w apps/storefront
      - name: Build
        run: npm run build -w apps/storefront

  docker:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, storefront]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same Dockerfiles Railway builds — catches a broken lockfile or build
      # step before the deploy does. Build context is the monorepo root.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # ---------------------------------------------------------------------------
  # CD — only on push to main, and only after every CI job above is green.
  # Needs these GitHub secrets (Settings > Secrets and variables > Actions):
  #   RAILWAY_TOKEN  Project token (Railway > Project > Settings > Tokens),
  #                  scoped to the `production` environment.
  # Service names below must match the Railway service names exactly.
  # Backend goes first: its predeploy runs `medusa db:migrate`, and the
  # storefront (which bakes the backend URL/publishable key at build time)
  # should only roll out against an already-migrated backend.
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend
    needs: [backend, storefront, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Railway
        run: npx --yes @railway/cli@latest up --ci --service backend --environment production

  deploy-storefront:
    name: Deploy storefront
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Railway
        run: npx --yes @railway/cli@latest up --ci --service storefront --environment production
